body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}

button.dg{background:var(--dg)}
button.ok{background:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}
.vol{font-weight:700;color:var(--ok)}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.prev img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--bd)}
.sum{display:flex;gap:10px;flex-wrap:wrap}
.sum div{flex:1;min-width:120px;background:var(--hd);border-radius:10px;padding:10px}
.sum b{display:block;font-size:20px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border:1px solid var(--bd);padding:7px 8px;text-align:center;vertical-align:middle}
th{background:var(--hd);font-size:13px}
td img{width:64px;height:64px;object-fit:cover;border-radius:6px;cursor:pointer;margin:2px}
td.act{white-space:nowrap}
td.act button{padding:5px 9px;font-size:12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.empty{color:var(--mut);padding:18px;text-align:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9}
#lb img{max-width:94%;max-height:90%;border-radius:8px}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.card{border:0;padding:0}th{background:#eee!important}td.act,th.act{display:none}}

.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:10px 4px;font-size:13px}.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}

select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[readonly]{opacity:.65; background: rgba(0,0,0,0.05); cursor: not-allowed;}
</style>
</head>

function ambilGPS(){return new Promise(function(res){

  if(!g||navigator.onLine===false){res(null);return}

function stamp(c,waktu,gps,kamera){
  var x=c.getContext("2d"),fs=Math.max(13,Math.round(c.width*0.028)),pad=Math.round(fs*0.6),lh=fs+4;

  else{
    L.push("GPS: "+gps.lat.toFixed(6)+", "+gps.lon.toFixed(6)+" (±"+Math.round(gps.acc)+" m)");
    var al=gps.alamat?tr_("lokasi")+": "+gps.alamat:tr_("lokNA");
    var w=bungkus(x,al,c.width-pad*2);

    res(c.toDataURL("image/jpeg",.7))};
    im.onerror=function(){res(null)};im.src=r.result};
  r.onerror=function(){res(null)};r.readAsDataURL(file)})}

function ambilFoto(cb,kamera){
  var i=document.createElement("input");i.type="file";i.accept="image/*";
  if(kamera){i.capture="environment";gpsP=ambilLokasi()}else{i.multiple=true}
  i.onchange=async function(){var g=kamera?await gpsP:null;gpsP=null;
    for(var f of i.files){var d=await kompres(f,kamera,g);if(d)cb(d)}};
  i.click()}
function show(n){[1,2,3].forEach(function(i){$("s"+i).style.display=i===n?"":"none";document.querySelector('[data-tab="'+i+'"]').classList.toggle("on",i===n)});
  if(n===2)fillSel();if(n===3)renderRekap()}
document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){show(+this.getAttribute("data-tab"))}});

/* ---- Langkah 1: daftar kendaraan ---- */
var DK=["fp","fl","ft"];
function showK(){DK.forEach(function(k){var m=$("v_"+k);if(tmpK[k]){m.src=tmpK[k];m.style.display="block"}else{m.removeAttribute("src");m.style.display="none"}})}
function setK(){$("k1t").textContent=tr_(editK?"editK":"daftarT");$("kSimpan").textContent=tr_(editK?"update":"simpan");$("kBatal").style.display=editK?"":"none"}
function kReset(){editK=null;tmpK={};["kNo","kP","kL","kVol"].forEach(function(i){$(i).value=""});$("kTinggi").textContent="0.00";showK();setK()}
document.querySelectorAll("[data-cam]").forEach(function(b){b.onclick=function(){var k=this.getAttribute("data-cam");ambilFoto(function(d){tmpK[k]=d;showK()},true)}});
$("kBatal").onclick=kReset;

function hitungTinggiK(){
  var p=num($("kP").value),l=num($("kL").value),v=num($("kVol").value);
  var t = (p&&l)? (v/(p*l)) : 0;
  $("kTinggi").textContent=fmt(t);
  return t;
}
$("kVol").addEventListener("input", hitungTinggiK);
$("kP").addEventListener("input", hitungTinggiK);
$("kL").addEventListener("input", hitungTinggiK);

$("kSimpan").onclick=function(){
  var no=$("kNo").value.trim().toUpperCase(),p=num($("kP").value),l=num($("kL").value),v=num($("kVol").value);
  if(!no){alert(tr_("aTruck"));return}
  if(!p||!l||!v){alert(tr_("aDim"));return}
  if(!tmpK.fp||!tmpK.fl||!tmpK.ft){alert(tr_("aFotoReg"));return}
  if(S.kendaraan.some(function(k){return k.nomor===no&&k.id!==editK})){alert(tr_("aDup"));return}
  
  var t = v/(p*l);
  var o={id:editK||Date.now(),nomor:no,p:p,l:l,t:t,volStd:v,fp:tmpK.fp,fl:tmpK.fl,ft:tmpK.ft};
  
  if(editK){S.kendaraan=S.kendaraan.map(function(k){return k.id===editK?o:k})}else{S.kendaraan.push(o)}
  save();kReset();renderK()};
function im(s){return s?'<img class="th" src="'+s+'">':""}
function renderK(){
  $("kTb").innerHTML=S.kendaraan.length?S.kendaraan.map(function(k,i){
    var vStd = k.volStd || (k.p*k.l*k.t);
    return '<tr><td>'+(i+1)+'</td><td><b>'+esc(k.nomor)+'</b></td><td>'+fmt(k.p)+'<br>'+im(k.fp)+'</td><td>'+fmt(k.l)+'<br>'+im(k.fl)+'</td><td>'+fmt(k.t)+'<br>'+im(k.ft)+'</td><td>'+fmt(vStd)+'</td><td class="act"><button class="sec" data-ke="'+k.id+'">'+tr_("bEdit")+'</button> <button class="dg" data-kd="'+k.id+'">'+tr_("bDel")+'</button></td></tr>'
  }).join(""):'<tr><td colspan="7" class="empty">'+tr_("empty1")+'</td></tr>'}
  
$("kTb").addEventListener("click",function(e){
  var d=e.target.getAttribute("data-kd"),ed=e.target.getAttribute("data-ke");
  if(d&&confirm(tr_("cDelK"))){S.kendaraan=S.kendaraan.filter(function(k){return String(k.id)!==d});save();renderK()}
  if(ed){var k=S.kendaraan.find(function(x){return String(x.id)===ed});if(!k)return;
    editK=k.id;$("kNo").value=k.nomor;$("kP").value=k.p;$("kL").value=k.l;
    var vStd = k.volStd || (k.p*k.l*k.t);
    $("kVol").value=fmt(vStd); hitungTinggiK();
    tmpK={fp:k.fp,fl:k.fl,ft:k.ft};showK();setK();window.scrollTo({top:0,behavior:"smooth"})}});

/* ---- Langkah 2: pilih kendaraan & catat rit ---- */
function curK(){return S.kendaraan.find(function(k){return String(k.id)===$("rSel").value})}
function hitR(){
  var p=num($("rP").value), l=num($("rL").value), v=num($("rVol").value);
  var t = (p&&l)? (v/(p*l)) : 0;
  $("rT").textContent=fmt(t);
}
function pilihK(){var k=curK();$("rBox").style.display=k?"":"none";if(!k)return;
  $("rNo").textContent=k.nomor;$("rP").value=k.p;$("rL").value=k.l;
  var vStd = k.volStd || (k.p*k.l*k.t);
  $("rVol").value=fmt(vStd);
  $("rThumbs").innerHTML=[["fp","p"],["fl","l"],["ft","t"]].map(function(x){return k[x[0]]?'<figure style="margin:0;text-align:center"><img class="th" src="'+k[x[0]]+'"><figcaption style="font-size:11px;color:var(--mut)">'+tr_(x[1])+'</figcaption></figure>':""}).join("");
  hitR()}
function fillSel(){var sel=$("rSel"),cur=sel.value;
  sel.innerHTML='<option value="">'+tr_("pilih")+'</option>'+S.kendaraan.map(function(k){return '<option value="'+k.id+'">'+esc(k.nomor)+'</option>'}).join("");
  sel.value=cur;if(sel.value!==cur)sel.value="";pilihK()}
function drawR(){$("rPrev").innerHTML=tmpR.map(function(s,i){return '<img src="'+s+'" data-i2="'+i+'" title="'+tr_("tapDel")+'">'}).join("")}
$("rPrev").addEventListener("click",function(e){var i=e.target.getAttribute("data-i2");if(i!==null){tmpR.splice(+i,1);drawR()}});
$("rSel").addEventListener("change",function(){var k=curK();tmpR=[];drawR();$("rMsg").textContent="";pilihK()});
$("rVol").addEventListener("input",hitR);
$("rCam").onclick=function(){ambilFoto(function(d){tmpR.push(d);drawR()},true)};
$("rGal").onclick=function(){ambilFoto(function(d){tmpR.push(d);drawR()},false)};
$("rSave").onclick=function(){
  var k=curK();if(!k){alert(tr_("aPilih"));return}
  var v=num($("rVol").value); if(!v){alert(tr_("aVol"));return}
  if(!tmpR.length){alert(tr_("aFotoRit"));return}
  
  var t = v / (k.p * k.l);
  var tg=S.tgl||hari();
  
  S.rits.push({id:Date.now(),kid:k.id,nomor:k.nomor,p:k.p,l:k.l,t:t,vol:v,foto:tmpR.slice(),tgl:tg,waktu:Date.now()});
  save();tmpR=[];drawR();
  
  var kStd = k.volStd || (k.p*k.l*k.t);
  $("rVol").value=fmt(kStd); hitR();
  
  var n=S.rits.filter(function(r){return r.nomor===k.nomor&&r.tgl===tg}).length;
  $("rMsg").textContent=tr_("ok")+" — "+k.nomor+" #"+n+" ("+fmt(v)+" m³)"};

/* ---- Langkah 3: rekap ---- */
function filt(){var a=$("fDari").value,b=$("fSmp").value;return S.rits.filter(function(r){return(!a||r.tgl>=a)&&(!b||r.tgl<=b)})}
function wkt(w){return new Date(w).toLocaleString(tr_("loc"),{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})}
function renderRekap(){
  var R=filt(),tot=0,by={},a=$("fDari").value,b=$("fSmp").value;
  R.forEach(function(r){tot+=r.vol;var x=by[r.nomor]=by[r.nomor]||{n:0,v:0};x.n++;x.v+=r.vol});
  $("rHead").textContent=tr_("rekapT")+(S.proyek?" — "+S.proyek:"")+((a||b)?" · "+(a||"…")+" – "+(b||"…"):"");
  $("sRit").textContent=R.length;$("sVol").textContent=fmt(tot)+" m³";
  var ks=Object.keys(by);
  $("aTb").innerHTML=ks.length?ks.map(function(n,i){return '<tr><td>'+(i+1)+'</td><td><b>'+esc(n)+'</b></td><td>'+by[n].n+'</td><td class="vol">'+fmt(by[n].v)+'</td></tr>'}).join(""):'<tr><td colspan="4" class="empty">'+tr_("empty2")+'</td></tr>';
  $("aTf").innerHTML=ks.length?'<tr><th colspan="2">'+tr_("total")+'</th><th>'+R.length+'</th><th>'+fmt(tot)+'</th></tr>':"";
  $("dTb").innerHTML=R.length?R.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td>'+(r.imp?r.tgl:wkt(r.waktu))+'</td><td><b>'+esc(r.nomor)+'</b></td><td>'+fmt(r.p)+' – '+fmt(r.l)+' – '+fmt(r.t)+'</td><td class="vol">'+fmt(r.vol)+'</td><td>'+r.foto.map(function(s){return '<img src="'+s+'" class="th">'}).join("")+'</td><td class="act noprint"><button class="dg" data-rd="'+r.id+'">'+tr_("bDel")+'</button></td></tr>'}).join(""):'<tr><td colspan="7" class="empty">'+tr_("empty2")+'</td></tr>';
  $("dTf").innerHTML=R.length?'<tr><th colspan="4">'+tr_("total")+' ('+R.length+' '+tr_("ritU")+')</th><th>'+fmt(tot)+'</th><th colspan="2"></th></tr>':""}
$("fDari").onchange=renderRekap;$("fSmp").onchange=renderRekap;
$("dTb").addEventListener("click",function(e){var d=e.target.getAttribute("data-rd");
  if(d&&confirm(tr_("cDelR"))){S.rits=S.rits.filter(function(r){return String(r.id)!==d});save();renderRekap()}});

// BACKUP / RESTORE FEATURES
$("backupBtn").onclick=function(){
  var dataStr=JSON.stringify(S);
  var blob=new Blob([dataStr],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="backup-urugan-tanah-"+(S.proyek||"proyek")+"-"+hari()+".json";
  a.click();
  URL.revokeObjectURL(url);
};
$("restoreBtn").onclick=function(){ $("restoreFile").click(); };
$("restoreFile").onchange=function(e){
  var file=e.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var parsed=JSON.parse(ev.target.result);
      if(parsed.kendaraan && parsed.rits){
        if(confirm("Ganti semua data saat ini dengan data dari file backup?")){
          S=parsed;
          save();
          if(S.proyek)$("proyek").value=S.proyek;
          if(S.tgl)$("tgl").value=S.tgl;
          renderK();fillSel();renderRekap();
          alert("Data berhasil dipulihkan!");
        }
      } else {
        alert("Format file tidak valid.");
      }
    }catch(err){
      alert("Gagal membaca file: "+err.message);
    }
  };
  reader.readAsText(file);
  e.target.value="";
};

$("csv").onclick=function(){
  var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"'};
  var out=[[tr_("no"),tr_("tgl"),tr_("waktu"),tr_("truck"),tr_("p"),tr_("l"),tr_("t"),tr_("vol"),tr_("nFoto")].map(q).join(",")];
  filt().forEach(function(r,i){out.push([i+1,r.tgl||"",(r.imp?"":wkt(r.waktu)),r.nomor,r.p,r.l,r.t,r.vol.toFixed(2),r.foto.length].map(q).join(","))});
  var bl=new Blob(["\ufeff"+out.join("\n")],{type:"text/csv"}),a=document.createElement("a");
  a.href=URL.createObjectURL(bl);a.download="rekap-urugan-tanah-"+hari()+".csv";a.click()};
$("cetak").onclick=function(){window.print()};
$("hapusSemua").onclick=function(){if(S.rits.length&&confirm(tr_("cDelAll"))){S.rits=[];save();renderRekap()}};

/* ---- umum ---- */
document.addEventListener("click",function(e){if(e.target.classList&&e.target.classList.contains("th")){$("lb").firstElementChild.src=e.target.src;$("lb").style.display="flex"}});
$("lb").onclick=function(){this.style.display="none"};
$("proyek").addEventListener("input",function(){S.proyek=this.value;save()});
$("tgl").addEventListener("change",function(){S.tgl=this.value;save()});
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=tr_(e.getAttribute("data-i"))});
  document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=tr_(e.getAttribute("data-ph"))});
  $("lang").textContent=tr_("sw");setK();renderK();fillSel();drawR();renderRekap()}
$("lang").onclick=function(){LANG=LANG==="id"?"vi":"id";S.lang=LANG;save();applyLang()};
load();LANG=S.lang==="vi"?"vi":"id";

// Default Value Logic
if(!S.proyek) S.proyek="Depot Banjar Baru";
$("proyek").value=S.proyek||"";
if(!S.tgl) S.tgl=hari();
$("tgl").value=S.tgl;

applyLang();showK();show(S.kendaraan.length?2:1);
</script>
</body>
