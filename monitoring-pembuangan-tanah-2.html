<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoring Pembuangan Tanah</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d9dde5;--pr:#b45309;--pr2:#92400e;--ok:#15803d;--dg:#b91c1c;--hd:#fef3c7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--card:#1e2129;--tx:#eceef3;--mut:#9aa3b2;--bd:#343945;--pr:#f59e0b;--pr2:#d97706;--hd:#3a2f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161b;--card:#1e2129;--tx:#eceef3;--mut:#9aa3b2;--bd:#343945;--pr:#f59e0b;--pr2:#d97706;--hd:#3a2f12;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input[type=text],input[type=number],input[type=date]{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--pr);color:#fff}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.dg{background:var(--dg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}
.vol{font-weight:700;color:var(--ok)}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.prev img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--bd)}
.sum{display:flex;gap:10px;flex-wrap:wrap}
.sum div{flex:1;min-width:120px;background:var(--hd);border-radius:10px;padding:10px}
.sum b{display:block;font-size:20px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border:1px solid var(--bd);padding:7px 8px;text-align:center;vertical-align:middle}
th{background:var(--hd);font-size:13px}
td img{width:64px;height:64px;object-fit:cover;border-radius:6px;cursor:pointer;margin:2px}
td.act{white-space:nowrap}
td.act button{padding:5px 9px;font-size:12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.empty{color:var(--mut);padding:18px;text-align:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9}
#lb img{max-width:94%;max-height:90%;border-radius:8px}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.card{border:0;padding:0}th{background:#eee!important}td.act,th.act{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1 data-i="title"></h1>
  <div class="sub" data-i="sub"></div></div>
  <button class="sec noprint" id="lang"></button></div>

  <div class="card noprint">
    <div class="grid">
      <div><label data-i="proyek"></label><input type="text" id="proyek" data-ph="phProyek"></div>
      <div><label data-i="tgl"></label><input type="date" id="tgl"></div>
    </div>
  </div>

  <div class="card noprint">
    <b id="ftitle"></b>
    <div class="grid" style="margin-top:8px">
      <div><label data-i="truck"></label><input type="text" id="truck" placeholder="KT 1234 AB"></div>
      <div><label data-i="p"></label><input type="number" id="p" step="0.01" min="0" inputmode="decimal"></div>
      <div><label data-i="l"></label><input type="number" id="l" step="0.01" min="0" inputmode="decimal"></div>
      <div><label data-i="t"></label><input type="number" id="t" step="0.01" min="0" inputmode="decimal"></div>
      <div><label data-i="vol"></label><div class="vol" id="vol" style="padding:9px 0;font-size:18px">0,00</div></div>
    </div>
    <div class="row">
      <div><label data-i="foto"></label>
        <button type="button" id="bCam" data-i="cam"></button>
        <button type="button" class="sec" id="bGal" data-i="gal"></button>
        <input type="file" id="foto" accept="image/*" capture="environment" hidden>
        <input type="file" id="fotoG" accept="image/*" multiple hidden></div>
    </div>
    <div class="prev" id="prev"></div>
    <div class="row">
      <button id="simpan"></button>
      <button class="sec" id="batal" style="display:none" data-i="batal"></button>
    </div>
  </div>

  <div class="card">
    <div class="sum">
      <div><span data-i="rit"></span><b id="sRit">0</b></div>
      <div><span data-i="totVol"></span><b id="sVol">0,00 m³</b></div>
    </div>
    <div class="row noprint">
      <button class="sec" id="csv" data-i="csv"></button>
      <button class="sec" id="cetak" data-i="print"></button>
      <button class="dg" id="hapusSemua" data-i="delAll"></button>
    </div>
    <div class="tw" style="margin-top:12px">
      <table>
        <thead><tr><th data-i="no"></th><th data-i="truck"></th><th data-i="thDim"></th><th data-i="vol"></th><th data-i="thFoto"></th><th class="act noprint" data-i="aksi"></th></tr></thead>
        <tbody id="tb"></tbody>
        <tfoot id="tf"></tfoot>
      </table>
    </div>
  </div>
</div>
<div id="lb"><img alt="Foto"></div>

<script>
var KEY="mpt_v1",S={proyek:"",tgl:"",rows:[]},tmp=[],editId=null;
var $=function(i){return document.getElementById(i)};
var LANG="id";
var TX={
id:{title:"Monitoring Pembuangan Tanah",sub:"Pencatatan rit truck, dimensi bak, volume & foto dokumentasi",proyek:"Proyek / Lokasi",phProyek:"Nama proyek",tgl:"Tanggal",add:"Tambah Data Truck",edit:"Edit Data Truck",truck:"Nomor Truck",p:"Panjang (m)",l:"Lebar (m)",t:"Tinggi (m)",vol:"Volume (m³)",foto:"Foto dokumentasi (bisa banyak)",cam:"📷 Ambil Foto (Kamera)",gal:"🖼️ Dari Galeri",simpan:"Simpan",update:"Perbarui",batal:"Batal edit",rit:"Total Rit",totVol:"Total Volume",csv:"Ekspor CSV",print:"Cetak / PDF",delAll:"Hapus semua",no:"No",thDim:"P (m) – L (m) – T (m)",thFoto:"Foto Dokumentasi",aksi:"Aksi",bEdit:"Edit",bDel:"Hapus",empty:"Belum ada data. Tambahkan data truck di atas.",total:"TOTAL",ritU:"rit",aTruck:"Nomor truck wajib diisi",aDim:"Panjang, lebar, dan tinggi wajib diisi",cDel:"Hapus data ini?",cDelAll:"Hapus SEMUA data?",full:"Penyimpanan penuh. Ekspor data lalu hapus sebagian foto.",tapDel:"Ketuk untuk hapus",gpsNA:"GPS: tidak tersedia",stGal:"Foto dari galeri (tanpa GPS)",lokasi:"Lokasi",lokNA:"Lokasi: nama tempat tidak tersedia (perlu internet)",nFoto:"Jumlah Foto",sw:"🌐 Tiếng Việt",loc:"id-ID"},
vi:{title:"Giám Sát Đổ Đất Thải",sub:"Ghi nhận chuyến xe tải, kích thước thùng, thể tích & ảnh tài liệu",proyek:"Dự án / Địa điểm",phProyek:"Tên dự án",tgl:"Ngày",add:"Thêm dữ liệu xe tải",edit:"Sửa dữ liệu xe tải",truck:"Biển số xe",p:"Dài (m)",l:"Rộng (m)",t:"Cao (m)",vol:"Thể tích (m³)",foto:"Ảnh tài liệu (có thể chụp nhiều ảnh)",cam:"📷 Chụp ảnh (Camera)",gal:"🖼️ Từ thư viện ảnh",simpan:"Lưu",update:"Cập nhật",batal:"Hủy sửa",rit:"Tổng số chuyến",totVol:"Tổng thể tích",csv:"Xuất CSV",print:"In / PDF",delAll:"Xóa tất cả",no:"STT",thDim:"D (m) – R (m) – C (m)",thFoto:"Ảnh tài liệu",aksi:"Thao tác",bEdit:"Sửa",bDel:"Xóa",empty:"Chưa có dữ liệu. Hãy thêm dữ liệu xe tải ở trên.",total:"TỔNG",ritU:"chuyến",aTruck:"Bắt buộc nhập biển số xe",aDim:"Bắt buộc nhập chiều dài, chiều rộng và chiều cao",cDel:"Xóa dữ liệu này?",cDelAll:"Xóa TẤT CẢ dữ liệu?",full:"Bộ nhớ đã đầy. Hãy xuất dữ liệu rồi xóa bớt ảnh.",tapDel:"Chạm để xóa",gpsNA:"GPS: không khả dụng",stGal:"Ảnh từ thư viện (không có GPS)",lokasi:"Địa điểm",lokNA:"Địa điểm: không khả dụng (cần internet)",nFoto:"Số ảnh",sw:"🌐 Bahasa Indonesia",loc:"vi-VN"}};
function tr_(k){return TX[LANG][k]}
function setForm(){$("ftitle").textContent=tr_(editId?"edit":"add");$("simpan").textContent=tr_(editId?"update":"simpan");$("batal").style.display=editId?"":"none"}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=tr_(e.getAttribute("data-i"))});
  document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=tr_(e.getAttribute("data-ph"))});
  $("lang").textContent=tr_("sw");setForm();drawPrev();render()}
$("lang").onclick=function(){LANG=LANG==="id"?"vi":"id";S.lang=LANG;save();applyLang()};

function fmt(n){return Number(n).toLocaleString("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(v){return parseFloat(v)||0}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert(tr_("full"))}}
function load(){try{var d=localStorage.getItem(KEY);if(d)S=JSON.parse(d)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hit(){var v=num($("p").value)*num($("l").value)*num($("t").value);$("vol").textContent=fmt(v);return v}
["p","l","t"].forEach(function(i){$(i).addEventListener("input",hit)});
$("proyek").addEventListener("input",function(){S.proyek=this.value;save()});
$("tgl").addEventListener("change",function(){S.tgl=this.value;save()});

function waktuLokal(d){return d.toLocaleString(tr_("loc"),{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,timeZoneName:"short"}).replace(/\./g,":")}
function ambilGPS(){return new Promise(function(res){
  if(!navigator.geolocation){res(null);return}
  navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy})},
    function(){res(null)},{enableHighAccuracy:true,timeout:12000,maximumAge:20000})})}
var gpsP=null,cacheAl={};
function ambilAlamat(g){return new Promise(function(res){
  if(!g||navigator.onLine===false){res(null);return}
  var k=LANG+g.lat.toFixed(4)+","+g.lon.toFixed(4);
  if(cacheAl[k]){res(cacheAl[k]);return}
  var ac=new AbortController(),tm=setTimeout(function(){ac.abort()},8000);
  fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language="+LANG+"&lat="+g.lat+"&lon="+g.lon,{signal:ac.signal})
    .then(function(r){return r.json()})
    .then(function(j){clearTimeout(tm);var a=j&&j.display_name?j.display_name:null;if(a)cacheAl[k]=a;res(a)})
    .catch(function(){clearTimeout(tm);res(null)})})}
function ambilLokasi(){return ambilGPS().then(function(g){if(!g)return null;return ambilAlamat(g).then(function(a){g.alamat=a;return g})})}
function bungkus(x,teks,maks){var w=teks.split(" "),L=[],cur="";
  w.forEach(function(k){var t=cur?cur+" "+k:k;if(x.measureText(t).width>maks&&cur){L.push(cur);cur=k}else cur=t});
  if(cur)L.push(cur);return L}
function stamp(c,waktu,gps,kamera){
  var x=c.getContext("2d"),fs=Math.max(13,Math.round(c.width*0.028)),pad=Math.round(fs*0.6),lh=fs+4;
  x.font="600 "+fs+"px system-ui,sans-serif";
  var L=[waktuLokal(waktu)];
  if(!kamera)L.push(tr_("stGal"));
  else if(!gps)L.push(tr_("gpsNA"));
  else{
    L.push("GPS: "+gps.lat.toFixed(6)+", "+gps.lon.toFixed(6)+" (±"+Math.round(gps.acc)+" m)");
    var al=gps.alamat?tr_("lokasi")+": "+gps.alamat:tr_("lokNA");
    var w=bungkus(x,al,c.width-pad*2);
    if(w.length>5){w=w.slice(0,5);w[4]+="…"}
    L=L.concat(w)}
  var h=L.length*lh+pad*2;
  x.fillStyle="rgba(0,0,0,.65)";x.fillRect(0,c.height-h,c.width,h);
  x.fillStyle="#fff";x.textBaseline="top";x.font="600 "+fs+"px system-ui,sans-serif";
  L.forEach(function(t,i){x.fillText(t,pad,c.height-h+pad+i*lh)})}
function kompres(file,kamera,gps){return new Promise(function(res){
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var m=1000,w=im.width,h=im.height,k=Math.min(1,m/Math.max(w,h));
    var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    stamp(c,kamera?new Date():new Date(file.lastModified||Date.now()),gps,kamera);
    res(c.toDataURL("image/jpeg",.75))};
    im.onerror=function(){res(null)};im.src=r.result};
  r.onerror=function(){res(null)};r.readAsDataURL(file)})}
function drawPrev(){$("prev").innerHTML=tmp.map(function(s,i){return '<img src="'+s+'" data-i="'+i+'" title="'+tr_("tapDel")+'">'}).join("")}
$("prev").addEventListener("click",function(e){var i=e.target.getAttribute("data-i");if(i!==null){tmp.splice(+i,1);drawPrev()}});
async function tambahFoto(kamera,inp){
  var gps=kamera?await (gpsP||ambilLokasi()):null;gpsP=null;
  for(var f of inp.files){var d=await kompres(f,kamera,gps);if(d)tmp.push(d)}
  inp.value="";drawPrev()}
$("foto").addEventListener("change",function(){tambahFoto(true,this)});
$("fotoG").addEventListener("change",function(){tambahFoto(false,this)});
$("bCam").onclick=function(){gpsP=ambilLokasi();$("foto").click()};
$("bGal").onclick=function(){$("fotoG").click()};

function reset(){editId=null;tmp=[];["truck","p","l","t"].forEach(function(i){$(i).value=""});hit();drawPrev();
  setForm()}
$("batal").onclick=reset;
$("simpan").onclick=function(){
  var tr=$("truck").value.trim();
  if(!tr){alert(tr_("aTruck"));return}
  var p=num($("p").value),l=num($("l").value),t=num($("t").value);
  if(!p||!l||!t){alert(tr_("aDim"));return}
  var o={id:editId||Date.now(),truck:tr,p:p,l:l,t:t,vol:p*l*t,foto:tmp.slice()};
  if(editId){S.rows=S.rows.map(function(r){return r.id===editId?o:r})}else{S.rows.push(o)}
  save();reset();render()};

function render(){
  var h="",tot=0;
  S.rows.forEach(function(r,i){tot+=r.vol;
    h+='<tr><td>'+(i+1)+'</td><td><b>'+esc(r.truck)+'</b></td><td>'+fmt(r.p)+' – '+fmt(r.l)+' – '+fmt(r.t)+'</td><td class="vol">'+fmt(r.vol)+'</td><td>'
    +(r.foto.length?r.foto.map(function(s){return '<img src="'+s+'" class="th">'}).join(""):'<span style="color:var(--mut)">–</span>')
    +'</td><td class="act noprint"><button class="sec" data-e="'+r.id+'">'+tr_("bEdit")+'</button> <button class="dg" data-d="'+r.id+'">'+tr_("bDel")+'</button></td></tr>'});
  $("tb").innerHTML=h||'<tr><td colspan="6" class="empty">'+tr_("empty")+'</td></tr>';
  $("tf").innerHTML=S.rows.length?'<tr><th colspan="3">'+tr_("total")+' ('+S.rows.length+' '+tr_("ritU")+')</th><th>'+fmt(tot)+'</th><th colspan="2"></th></tr>':"";
  $("sRit").textContent=S.rows.length;$("sVol").textContent=fmt(tot)+" m³"}

$("tb").addEventListener("click",function(e){
  var d=e.target.getAttribute("data-d"),ed=e.target.getAttribute("data-e");
  if(e.target.classList.contains("th")){$("lb").firstElementChild.src=e.target.src;$("lb").style.display="flex";return}
  if(d&&confirm(tr_("cDel"))){S.rows=S.rows.filter(function(r){return r.id!=d});save();render()}
  if(ed){var r=S.rows.find(function(x){return x.id==ed});if(!r)return;
    editId=r.id;$("truck").value=r.truck;$("p").value=r.p;$("l").value=r.l;$("t").value=r.t;tmp=r.foto.slice();hit();drawPrev();
    setForm();
    window.scrollTo({top:0,behavior:"smooth"})}});
$("lb").onclick=function(){this.style.display="none"};

$("csv").onclick=function(){
  var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"'};
  var out=[[tr_("no"),tr_("truck"),tr_("p"),tr_("l"),tr_("t"),tr_("vol"),tr_("nFoto")].map(q).join(",")];
  S.rows.forEach(function(r,i){out.push([i+1,r.truck,r.p,r.l,r.t,r.vol.toFixed(2),r.foto.length].map(q).join(","))});
  var b=new Blob(["\ufeff"+out.join("\n")],{type:"text/csv"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="pembuangan-tanah-"+(S.tgl||"data")+".csv";a.click()};
$("cetak").onclick=function(){window.print()};
$("hapusSemua").onclick=function(){if(S.rows.length&&confirm(tr_("cDelAll"))){S.rows=[];save();render()}};

load();$("proyek").value=S.proyek||"";$("tgl").value=S.tgl||new Date().toISOString().slice(0,10);S.tgl=$("tgl").value;
LANG=S.lang==="vi"?"vi":"id";
applyLang();
</script>
</body>
</html>
